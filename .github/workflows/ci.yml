name: ci

# Stub CI — no remote is configured yet (the repo is kept local for now).
# Enable by pushing to a remote; the job mirrors the local quality gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
